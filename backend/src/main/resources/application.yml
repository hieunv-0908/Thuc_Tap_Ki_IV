spring:
  application:
    name: funnyshop
  profiles:
    active: dev
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

server:
  port: 8080

jwt:
  # Chuỗi Secret Key tối thiểu 256 bits (32 chars) cho HMAC-SHA256 (có thể override qua biến môi trường JWT_SECRET)
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
  # Thời hạn Access Token: 1800000 ms = 30 phút
  access-expiration: 1800000
  # Giữ backward-compatible với jwt.expiration cũ nếu có
  expiration: 1800000
  # Thời hạn Refresh Token: 604800000 ms = 7 ngày
  refresh-expiration: 604800000

app:
  security:
    token-blacklist:
      # Chuyển đổi giữa 2 chế độ: 'in-memory' (local dev RAM) hoặc 'redis' (production/staging)
      provider: in-memory

payos:
  client-id: ${PAYOS_CLIENT_ID:ae3108e3-17f9-43cc-8aea-e0bddd7ba86b}
  api-key: ${PAYOS_API_KEY:96cbc67d-b033-40dc-a04a-5b5c9319f2dd}
  checksum-key: ${PAYOS_CHECKSUM_KEY:00548434b45f9cc139b6050fc4ce4983ecbbf9dfdab1802a6124a3e1351d72a8}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/orders/{orderId}?payment=success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/orders/{orderId}?payment=cancelled}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash}

logging:
  level:
    com.funnyshop: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dtdpmvyzq}
  api-key: ${CLOUDINARY_API_KEY:832254241169418}
  api-secret: ${CLOUDINARY_API_SECRET:hLQ4s1U8qINkSogzFLmxn2UGdMs}
